version: '3.8'

services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: english-word-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: english_word_app
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"                          # ⚠️ 独立端口，避免与eatwhere(3306)冲突
    volumes:
      - mysql-data:/var/lib/mysql
      # 数据库初始化脚本（可选，Flyway会自动创建表）
      # - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    networks:
      - english-word-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 40s

  # Spring Boot应用
  app:
    # 使用官方OpenJDK 17镜像
    image: eclipse-temurin:17-jre-alpine
    container_name: english-word-app
    restart: always
    working_dir: /app
    environment:
      # 数据库连接配置（连接到MySQL容器）
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/english_word_app?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      # 智谱AI API Key
      ZHIPUAI_API_KEY: ${ZHIPUAI_API_KEY}
      TZ: Asia/Shanghai
    ports:
      - "8885:8885"                          # ⚠️ 独立端口，避免与eatwhere(8883)冲突
    volumes:
      # 挂载jar包
      - ./target/english-word-backend-1.0.0.jar:/app/app.jar
      # 挂载上传文件目录
      - ./uploads:/app/uploads
    networks:
      - english-word-network
    depends_on:
      mysql:
        condition: service_healthy
    command: ["java", "-jar", "app.jar"]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8885/api/health"]
      timeout: 10s
      retries: 5
      interval: 30s
      start_period: 60s

# 数据卷
volumes:
  mysql-data:
    driver: local

# 网络
networks:
  english-word-network:
    driver: bridge
