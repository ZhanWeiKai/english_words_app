server:
  port: 8885
  servlet:
    context-path: /api

spring:
  application:
    name: english-word-backend
  # 本地数据库配置
  datasource:
    url: jdbc:mysql://119.91.206.195:3307/english_word_app?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  # 默认激活 local profile
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2MB


# JWT配置
jwt:
  secret: EnglishWordAppSecretKey2026ForJWTTokenGenerationMustBeLongEnough
  expiration: 604800000  # 7天 (单位: 毫秒)

# 日志配置
logging:
  level:
    root: INFO
    com.englishword: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# SpringDoc配置
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  packages-to-scan: com.englishword.controller

# AI Chat 配置（支持 OpenAI 兼容 API）
ai:
  chat:
    enabled: true
    api-url: https://open.bigmodel.cn/api/coding/paas/v4/chat/completions
    api-key: 686aaa8dabec4d57a159f1eaf1082512.CpkL4TBjSusy6F7N
    model: GLM-4.7
    timeout: 60
    temperature: 0.7
    max-tokens: 2000

# DashScope 配置（ASR语音识别 / TTS语音合成）
dashscope:
  api-key: sk-f064b98676d8401fb6139d9a5e2cf78b
  asr:
    model: fun-asr-mtl  # 多语言语音识别
