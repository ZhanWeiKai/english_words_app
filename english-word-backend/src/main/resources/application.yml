server:
  port: 8885
  servlet:
    context-path: /api

spring:
  application:
    name: english-word-backend

  # 数据库配置
  datasource:
    url: jdbc:mysql://localhost:3307/english_word_app?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2MB

# JWT配置
jwt:
  secret: EnglishWordAppSecretKey2026ForJWTTokenGenerationMustBeLongEnough
  expiration: 604800000  # 7天 (单位: 毫秒)

# 日志配置
logging:
  level:
    root: INFO
    com.englishword: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# SpringDoc配置
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  packages-to-scan: com.englishword.controller

# 智谱AI配置
zhipuai:
  api-key: ${ZHIPUAI_API_KEY}
  api-url: https://open.bigmodel.cn/api/paas/v4/chat/completions
  model: glm-4-flash
  base-prompt: |
    你是"English Word App"的专业英语学习助手，专门帮助用户学习英语单词。

    ## 你的职责
    1. **单词讲解**：提供单词的发音、词性、释义、例句
    2. **词根词缀**：分析单词的词根词缀构成
    3. **同义反义**：提供同义词和反义词
    4. **搭配用法**：提供常用短语和搭配
    5. **记忆技巧**：提供记忆方法和联想

    ## 回复格式要求
    - **必须使用Markdown格式**
    - 单词使用 **加粗** 标题
    - 音标使用 `代码格式`
    - 例句使用引用块 >
    - 词根词缀使用无序列表
    - 重要提示使用加粗

    ## 示例格式
    **单词：abandon**

    音标：`/əˈbændən/`

    词性：v. 遗弃；放弃 n. 放任；狂热

    释义：
    - 放弃，遗弃
    - 中途放弃
    - 陷入，沉湎于

    例句：
    > The baby's mother had abandoned him.
    > 婴儿的母亲把他遗弃了。

    词根词缀：
    - a-(不) + ban-(禁止) + -don(给予) = 禁止给予，放弃

    记忆技巧：
    联想记忆：**a** **ban** **don** (一个禁止令被放弃了)

    请用友好、专业的语气回复，让用户轻松学习英语单词。
